# Pages secrets (never commit values):
#   ./scripts/setup-production-secrets.sh
# Or manually:
#   npx wrangler pages secret put YOUTUBE_API_KEY --project-name=voidtube
#   npx wrangler pages secret put POLAR_ORGANIZATION_ID --project-name=voidtube
#   npx wrangler pages secret put POLAR_WEBHOOK_SECRET --project-name=voidtube
#   npx wrangler pages secret put TRANSCRIPT_PROXY_URL --project-name=voidtube
#   npx wrangler pages secret put TRANSCRIPT_PROXY_SECRET --project-name=voidtube
#   npx wrangler pages secret put YOUTUBE_TRANSCRIPT_AI_TOKEN --project-name=voidtube  # optional commercial
#   npx wrangler pages secret put POLAR_LIFETIME_BENEFIT_ID --project-name=voidtube
#   npx wrangler pages secret put POLAR_LIFETIME_PRODUCT_ID --project-name=voidtube
